[package]
name = "fingest-client-catalog-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Category use cases. Pure — drives ports, knows no transport."

# Dependency rule: interior of the hexagon. No dioxus, reqwest, web-sys, gloo or tokio.
# Enforced by fingest-web-ports/tests/dependency_rule.rs.
[dependencies]
fingest-client-ports = { path = "../fingest-client-ports" }
fingest-contracts = { workspace = true }
async-trait = { workspace = true }

[features]
test-support = ["fingest-client-ports/test-support"]

[dev-dependencies]
fingest-client-ports = { path = "../fingest-client-ports", features = ["test-support"] }
futures = { workspace = true }

[lints]
workspace = true
