name: lockfile-consistency

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cargo-locked-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check (locked)
        run: cargo check --workspace --locked
